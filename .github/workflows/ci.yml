name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  csharp:
    name: C# build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/csharp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build Snowed.sln -c Release
      - name: Test
        run: dotnet test Snowed.Tests -c Release --no-build --logger "console;verbosity=normal"
